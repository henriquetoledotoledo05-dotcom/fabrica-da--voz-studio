<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10091b">
<meta property="og:title" content="Central de Vozes">
<meta property="og:description" content="Ouça os demonstrativos e escolha a voz ideal para sua locução.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.fabricadavozstudio.com.br/central-demonstrativos">
<meta property="og:image" content="https://www.fabricadavozstudio.com.br/central-demonstrativo-capa.png">
<meta property="og:image:secure_url" content="https://www.fabricadavozstudio.com.br/central-demonstrativo-capa.png">
<meta property="og:image:type" content="image/png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Central de Vozes">
<meta name="twitter:description" content="Ouça os demonstrativos e escolha a voz ideal para sua locução.">
<meta name="twitter:image" content="https://www.fabricadavozstudio.com.br/central-demonstrativo-capa.png">
<title>Central de Demonstrativos</title>
<style>
:root{color-scheme:dark;--bg:#09070d;--panel:#15101d;--purple:#a855f7;--gold:#ffcc00;--white:#fff;--muted:#d1d1d6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at top,#21102f 0,#0d0913 45%,#070609 100%);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{padding:24px 18px 34px;text-align:center;border-bottom:1px solid #a855f733;background:linear-gradient(180deg,#130b1d99,#09070d22)}
.cover-central{display:block;width:100%;max-width:1000px;height:auto;max-height:none;object-fit:contain;margin:0 auto 26px;border-radius:18px;border:1px solid #a855f7;box-shadow:0 0 28px #a855f733}
.logo{font-size:clamp(30px,5vw,48px);font-weight:900;letter-spacing:1px;text-shadow:0 0 22px #a855f744}
.logo span{color:var(--gold)}
header p{color:var(--muted);line-height:1.6;margin:12px auto 22px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
button{border:1px solid transparent;border-radius:11px;padding:13px 17px;font-weight:800;letter-spacing:.2px;cursor:pointer;transition:transform .18s,box-shadow .18s}
button:hover{transform:translateY(-2px);box-shadow:0 0 18px #a855f755}
.primary{background:linear-gradient(135deg,#a855f7,#7629bd);color:#fff}
.gold{background:linear-gradient(135deg,#ffdf40,#ffcc00);color:#17121f}
.wrap{max-width:1240px;margin:auto;padding:28px 18px 52px}
.search{width:100%;max-width:620px;display:block;margin:0 auto 30px;padding:16px 18px;border:1px solid #68418a;border-radius:13px;background:#100b16;color:#fff;font-size:16px;outline:none}
.search:focus{border-color:var(--purple);box-shadow:0 0 0 3px #a855f722}
.category-title{font-size:clamp(22px,3vw,28px);margin:36px 0 18px;padding-bottom:12px;border-bottom:1px solid #a855f766;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr));gap:18px}
.card{min-width:0;background:linear-gradient(155deg,#1b1424,#0d0a12 78%);border:1px solid #a855f733;border-radius:18px;padding:22px 17px;text-align:center;box-shadow:0 12px 30px #0005;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:#a855f7;box-shadow:0 12px 32px #0007,0 0 18px #a855f71c}
.photo{width:124px;height:124px;border-radius:50%;object-fit:cover;object-position:center;background:#20162b;border:3px solid var(--purple);box-shadow:0 0 0 4px #a855f71c,0 0 24px #a855f733;margin:0 auto 15px;display:block}
.card h2{font-size:21px;margin:8px 0 16px;color:#fff;letter-spacing:.2px}
audio{width:100%;height:42px;margin:0 0 14px;accent-color:var(--purple)}
.card button{width:100%;min-height:46px;background:linear-gradient(135deg,#a855f7,#7629bd);color:#fff;border:1px solid #c084fc55;font-size:14px}
footer{text-align:center;color:#bcaecb;padding:28px 16px;border-top:1px solid #ffffff12;font-size:13px}
.empty{text-align:center;color:#d4c8df;display:none;padding:24px}
@media(max-width:520px){header{padding:14px 12px 26px}.cover-central{border-radius:12px;margin-bottom:20px}.wrap{padding:20px 13px 36px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{padding:15px 10px;border-radius:14px}.photo{width:88px;height:88px}.card h2{font-size:17px}.card button{font-size:12px;padding:12px 8px}.category-title{margin-top:28px}}
@media(max-width:350px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <img class="cover-central" src="/central-demonstrativo-capa.png" alt="Central de Vozes" width="900" height="360">
  <div class="logo">CENTRAL <span>DE VOZES</span></div>
  <p>Central de Demonstrativos<br>Ouça as vozes e escolha a ideal para sua locução!</p>
  <div class="actions">
    <button class="gold" id="share">Compartilhar central</button>
    <button class="primary" id="copy">Copiar link</button>
  </div>
</header>
<main class="wrap">
  <input class="search" id="search" type="search" placeholder="🔎 Buscar locutor pelo nome...">
  <section id="masculinos-section">
  <h2 class="category-title">🎙️ Locutores masculinos</h2>
  <div class="grid" id="masculinos"></div>
</section>
<section id="femininos-section">
  <h2 class="category-title">🎤 Locutoras femininas</h2>
  <div class="grid" id="femininos"></div>
</section>
<section id="infantis-section">
  <h2 class="category-title">🧒 Vozes infantis</h2>
  <div class="grid" id="infantis"></div>
</section>
  <div class="empty" id="empty">Nenhum locutor encontrado.</div>
</main>
<footer>Escolha sua voz favorita!</footer>
<script>
const locutores = [
  ["Noah","noah.png","NOAH.mp3"],
  ["Nina","nina.png","NINA.mp3"],
  ["Celso","celso.png","CELSO.mp3"],
  ["Pedro","pedro.png","PEDRO.mp3"],
  ["Henrique","/henrique-foto.png","HENRIQUE.mp3"],
  ["Rafael","/rafael-foto.png","RAFAEL.mp3"],
  ["Vinícius","/vinicius-foto.png","VINÍCIUS.mp3"],
  ["Vitor","/vitor-foto.png","VITOR.mp3"],
  ["Lourenço","lourenco.png","LOURENÇO.mp3"],
  ["Gustavo","gustavo.png","GUSTAVO.mp3"],
  ["Flavinha","/flavinha-foto.png","FLAVINHA.mp3"],
  ["Aninha","/aninha-foto.png","ANINHA.mp3"],
  ["Paulinho","/paulinho-foto.png","PAULINHO.mp3"],
  ["Luiza","luiza.png","LUÍZA.mp3"],
  ["Gaby","gaby.png","GABY.mp3"],
  ["Angelo","/angelo-foto.png","ANGELO.mp3"],
  ["Bruno","/bruno-foto.png","BRUNO.mp3"],
  ["Letícia","/leticia-foto.png","LETÍCIA.mp3"],
  ["Regiane","/regiane-foto.png","REGIANE.mp3"],
  ["Ricardo","/ricardo-foto.png","RICARDO.mp3"],
  ["Belkis","/belkis-foto.png","BELKIS.mp3"]
];
const baseFotos = "/central-demonstrativos/fotos/";
const baseAudios = "/central%20de%20demonstrativo/";


function renderizar(filtro="") {
  const grupos = [
    {
      id: "masculinos",
      nomes: ["Noah","Celso","Pedro","Henrique","Rafael","Vinícius","Vitor","Lourenço","Gustavo","Angelo","Bruno","Ricardo"]
    },
    {
      id: "femininos",
      nomes: ["Nina","Luiza","Gaby","Letícia","Regiane","Belkis"]
    },
    {
      id: "infantis",
      nomes: ["Flavinha","Aninha","Paulinho"]
    }
  ];

  const termo = filtro.toLocaleLowerCase("pt-BR");
  const encontrados = locutores.filter(v =>
    v[0].toLocaleLowerCase("pt-BR").includes(termo)
  );

  document.getElementById("empty").style.display =
    encontrados.length ? "none" : "block";

  grupos.forEach(grupo => {
    const secao = document.getElementById(grupo.id + "-section");
    const gridGrupo = document.getElementById(grupo.id);
    const lista = encontrados.filter(v => grupo.nomes.includes(v[0]));

    gridGrupo.innerHTML = "";
    secao.style.display = lista.length ? "block" : "none";

    lista.forEach(([nome,foto,audio]) => {
      const card = document.createElement("article");
      card.className = "card";

      const img = document.createElement("img");
      img.className = "photo";
      img.alt = "Foto de " + nome;
      img.src = foto.startsWith("/") ? foto : baseFotos + foto;
      img.onerror = () => { img.style.display = "none"; };

      const titulo = document.createElement("h2");
      titulo.textContent = nome;

      const player = document.createElement("audio");
      player.controls = true;
      player.preload = "none";
      player.src = baseAudios + encodeURIComponent(audio);
      player.setAttribute("aria-label", "Ouvir demonstrativo de " + nome);

      player.addEventListener("play", () => {
        document.querySelectorAll("audio").forEach(a => {
          if (a !== player) a.pause();
        });
      });

      const btn = document.createElement("button");
      btn.className = "primary";
      btn.textContent = "Compartilhar este locutor";
      btn.onclick = () => compartilhar(nome);

      card.append(img, titulo, player, btn);
      gridGrupo.appendChild(card);
    });
  });
}
async function compartilhar(nome = "") {
  const nomeLimpo = String(nome || "").trim();
  const mensagem = nomeLimpo
    ? `Olha essa voz da Fábrica da Voz! 🎙️\nLocutor escolhido: ${nomeLimpo}\nOuça os demonstrativos: ${location.href}`
    : `Ouça os demonstrativos e escolha sua voz favorita na Central de Vozes: ${location.href}`;
  const dados = {
    title: nomeLimpo ? `Locutor ${nomeLimpo} - Fábrica da Voz` : "Central de Vozes",
    text: mensagem,
    url: location.href
  };
  try {
    if (navigator.share) {
      await navigator.share(dados);
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(mensagem);
      alert("Mensagem copiada! Agora escolha onde deseja compartilhar.");
    } else {
      prompt("Copie a mensagem para compartilhar:", mensagem);
    }
  } catch(e) {
    if (e.name !== "AbortError") prompt("Copie a mensagem para compartilhar:", mensagem);
  }
}
document.getElementById("share").onclick = compartilhar;
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); alert("Link copiado!"); }
  catch(e) { prompt("Copie o link abaixo:",location.href); }
};
document.getElementById("search").addEventListener("input",e => renderizar(e.target.value.trim()));
renderizar();
</script>
</body>
</html>
